plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '26'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', '1.0.0')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.ai:spring-ai-starter-model-azure-openai'
	implementation "dev.langchain4j:langchain4j:1.10.0"
	implementation "dev.langchain4j:langchain4j-azure-open-ai:1.10.0"
	implementation "dev.langchain4j:langchain4j-open-ai:1.10.0"
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.42.1'

	implementation 'com.azure:azure-identity:1.13.3'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.mapstruct:mapstruct:1.6.3'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

springBoot {
	mainClass = 'com.example.agentplayground.AgentPlaygroundApplication'
}

tasks.named('test') {
	useJUnitPlatform()
}