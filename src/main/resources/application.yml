spring:
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
      - org.springframework.ai.autoconfigure.vertexai.gemini.VertexAiGeminiAutoConfiguration
      - org.springframework.ai.autoconfigure.azure.openai.AzureOpenAiAutoConfiguration
      - org.springframework.ai.autoconfigure.anthropic.AnthropicAutoConfiguration
  main:
    allow-bean-definition-overriding: true
  application:
    name: agent-playground
  config:
    import: optional:classpath:application-local.properties

  ai:
    azure:
      openai:
        
        # Multi-model configuration
        models:
          gpt-wave:
            display-name: gpt-wave
            api-key: ${AZURE_OPENAI_GPT41_API_KEY:${AZURE_OPENAI_API_KEY:}}
            endpoint: ${AZURE_OPENAI_ENDPOINT:}
            deployment-name: ${AZURE_OPENAI_GPT5_DEPLOYMENT_NAME:}
          gpt-5-1:
             display-name: ${AZURE_OPENAI_GPT5_DEPLOYMENT_NAME:}
             api-key: ${AZURE_OPENAI_GPT41_API_KEY:${AZURE_OPENAI_API_KEY:}}
             endpoint: ${AZURE_OPENAI_ENDPOINT:}
             deployment-name: ${AZURE_OPENAI_GPT5_DEPLOYMENT_NAME:}
          gemini-3-pro:
            display-name: gemini-3-pro
            api-key: ${GOOGLE_AI_API_KEY:}
            endpoint: ${GOOGLE_AI_ENDPOINT:}
            deployment-name: ${GOOGLE_AI_GEMINI3_PRO_DEPLOYMENT_NAME:}
          gemini-3-flash:
            display-name: gemini-3-flash
            api-key: ${GOOGLE_AI_API_KEY:}
            endpoint: ${GOOGLE_AI_ENDPOINT:}
            deployment-name: ${GOOGLE_AI_GEMINI3_FLASH_DEPLOYMENT_NAME:}
          gemini-3-pro-wave:
            display-name: gemini-3-pro-wave
            api-key: ${GOOGLE_AI_API_KEY:}
            endpoint: ${GOOGLE_AI_ENDPOINT:}
            deployment-name: ${GOOGLE_AI_GEMINI3_PRO_DEPLOYMENT_NAME:}
          gemini-3-flash-wave:
            display-name: gemini-3-flash-wave
            api-key: ${GOOGLE_AI_API_KEY:}
            endpoint: ${GOOGLE_AI_ENDPOINT:}
            deployment-name: ${GOOGLE_AI_GEMINI3_FLASH_DEPLOYMENT_NAME:}

server:
  port: 8080
